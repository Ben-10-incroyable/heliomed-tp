# VM helio-front (192.168.56.10) — reverse proxy Nginx, point d'entree HelioMed
name: heliomed-front

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: helio-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - proxy_logs:/var/log/nginx
    extra_hosts:
      - "helio-app:192.168.56.11"

volumes:
  proxy_logs:

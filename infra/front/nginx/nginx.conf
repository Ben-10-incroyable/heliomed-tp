user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format de log enrichi : conserve l'upstream et le temps de reponse.
    # Servira de source d'evenements pour le SIEM (Wazuh) aux exercices suivants.
    log_format  helio  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'upstream=$upstream_addr rt=$request_time';

    access_log  /var/log/nginx/access.log  helio;

    sendfile        on;
    keepalive_timeout  65;

    # ETAT INITIAL (exercice 1) : banniere de version laissee active,
    # aucune en-tete de securite, pas de limitation de debit.
    # Ces trois points sont des constats a relever puis a corriger en exercice 2 :
    #   server_tokens off;
    #   add_header X-Content-Type-Options nosniff always;
    #   add_header X-Frame-Options DENY always;
    #   add_header Strict-Transport-Security "max-age=31536000" always;
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}

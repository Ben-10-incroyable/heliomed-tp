upstream heliomed_api {
    server 192.168.56.11:3000;   # API de prise de rendez-vous
}

upstream heliomed_legacy {
    server 192.168.56.11:8080;   # back-office historique
}

# --- HTTP ---------------------------------------------------------------
# ETAT INITIAL : le trafic en clair est servi tel quel (pas de redirection 301).
# Constat exercice 1 : donnees de sante transmissibles en clair.
server {
    listen 80;
    server_name heliomed.lab 192.168.56.10;

    location / {
        proxy_pass         http://heliomed_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    location /legacy/ {
        proxy_pass       http://heliomed_legacy/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS --------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name heliomed.lab 192.168.56.10;

    ssl_certificate     /etc/nginx/certs/heliomed.crt;
    ssl_certificate_key /etc/nginx/certs/heliomed.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://heliomed_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    location /legacy/ {
        proxy_pass       http://heliomed_legacy/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
